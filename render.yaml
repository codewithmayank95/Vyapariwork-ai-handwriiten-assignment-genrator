services:
  - type: web
    name: ai-handwritten-generator
    env: python
    buildCommand: pip install -r backend/requirements.txt
    startCommand: uvicorn backend.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHONPATH
        value: .
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: USE_IMAGE_GENERATION
        value: "true"
      - key: GEMINI_API_KEY
        sync: false
